<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PyEngine Vercel Demo</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at top, #243b55, #141e30 55%, #070b12); color: #f8fafc; }
      main { width: min(920px, calc(100% - 32px)); padding: 40px; border: 1px solid rgba(255,255,255,.14); border-radius: 28px; background: rgba(15,23,42,.72); box-shadow: 0 30px 80px rgba(0,0,0,.45); backdrop-filter: blur(18px); }
      h1 { margin: 0 0 12px; font-size: clamp(2rem, 5vw, 4.5rem); line-height: .95; letter-spacing: -.06em; }
      p { color: #cbd5e1; font-size: 1.1rem; line-height: 1.7; max-width: 70ch; }
      .panel { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); margin-top: 28px; }
      .card { padding: 22px; border-radius: 20px; background: rgba(30,41,59,.82); border: 1px solid rgba(148,163,184,.25); }
      .label { color: #93c5fd; font-size: .75rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
      pre { overflow: auto; margin: 12px 0 0; padding: 18px; border-radius: 16px; background: #020617; color: #86efac; line-height: 1.25; }
      button { margin-top: 22px; border: 0; border-radius: 999px; padding: 12px 18px; background: #38bdf8; color: #082f49; font-weight: 800; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div class="label">Deploy-ready Python on Vercel</div>
      <h1>PyEngine serverless demo</h1>
      <p>This static frontend calls a Python Vercel Function at <code>/api</code>, runs a deterministic PyEngine scene, and renders live engine state as JSON and terminal art.</p>
      <button id="refresh">Run another frame batch</button>
      <section class="panel">
        <article class="card"><div class="label">Engine state</div><pre id="state">Loading…</pre></article>
        <article class="card"><div class="label">Rendered frame</div><pre id="frame">Loading…</pre></article>
      </section>
    </main>
    <script>
      let frames = 12;
      async function loadDemo() {
        const response = await fetch(`/api?frames=${frames}`);
        const data = await response.json();
        document.querySelector('#state').textContent = JSON.stringify({ engine: data.engine, version: data.version, frames: data.frames, player_position: data.player_position, collisions: data.collisions }, null, 2);
        document.querySelector('#frame').textContent = data.frame;
      }
      document.querySelector('#refresh').addEventListener('click', () => { frames = frames >= 48 ? 0 : frames + 12; loadDemo(); });
      loadDemo();
    </script>
  </body>
</html>
